services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Passw0rd!
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26.1-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  agent-api:
    build: ./agent-api
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: legal-rag-content
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: knowledge-root
      SAMPLES_DIR: /workspace/samples
      EVAL_RESULTS_DIR: /workspace/eval-results
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      PLANNER_MODEL: gemma4:e4b
      ANSWER_MODEL: gemma4:e4b
      JUDGE_MODEL: none
      LLM_TIMEOUT_SEC: 90
      LLM_MAX_CONTEXT_CHARS: 4000
    ports:
      - "8000:8000"
    depends_on:
      opensearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./docs/requirements/samples:/workspace/samples:ro
      - ./eval-results:/workspace/eval-results

  agent-ui:
    build: ./agent-ui
    environment:
      AGENT_API_URL: http://agent-api:8000
    ports:
      - "8501:8501"
    depends_on:
      - agent-api

  eval-runner:
    build: ./eval-runner
    environment:
      AGENT_API_URL: http://agent-api:8000
      SAMPLES_DIR: /workspace/samples
      EVAL_RESULTS_DIR: /workspace/eval-results
    depends_on:
      - agent-api
    volumes:
      - ./docs/requirements/samples:/workspace/samples:ro
      - ./eval-results:/workspace/eval-results
    profiles:
      - eval

volumes:
  minio_data:
  opensearch_data:
  neo4j_data:
  neo4j_logs:
