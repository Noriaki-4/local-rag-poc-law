services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch:
    build:
      context: ./opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Passw0rd!
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26.1-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  reranker-api:
    build: ./reranker-api
    environment:
      RERANK_MODEL: ${RERANK_MODEL:-hotchpotch/japanese-reranker-base-v2}
      RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-512}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-8}
      OMP_NUM_THREADS: ${RERANK_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${RERANK_CPU_THREADS:-4}
    ports:
      - "8100:8100"
    volumes:
      - reranker_models:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s

  agent-api:
    build: ./agent-api
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-legal-rag-content-ja-v2}
      OPENSEARCH_INDEX_MAPPING: ${OPENSEARCH_INDEX_MAPPING:-metadata/opensearch_index_mapping.japanese.sample.json}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      LEGAL_RELATION_CLASSIFICATION_RUN_ID: ${LEGAL_RELATION_CLASSIFICATION_RUN_ID:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: knowledge-root
      SAMPLES_DIR: /workspace/samples
      EVAL_RESULTS_DIR: /workspace/eval-results
      LAWQA_EVAL_PATH: ${LAWQA_EVAL_PATH:-}
      LAWQA_EVAL_URL: ${LAWQA_EVAL_URL:-}
      SEED_LAWQA_EGOV: ${SEED_LAWQA_EGOV:-false}
      LAWQA_EGOV_LAW_IDS: ${LAWQA_EGOV_LAW_IDS:-}
      EGOV_API_BASE_URL: ${EGOV_API_BASE_URL:-https://laws.e-gov.go.jp/api/1}
      EGOV_LAW_CORPUS_MANIFEST: ${EGOV_LAW_CORPUS_MANIFEST:-/workspace/datasets/lawqa_jp/egov_law_corpus/manifest.json}
      SEED_SCENARIO_MANIFEST: ${SEED_SCENARIO_MANIFEST:-}
      SEED_EXTERNAL_GUIDANCE: ${SEED_EXTERNAL_GUIDANCE:-false}
      EXTERNAL_GUIDANCE_MANIFEST: ${EXTERNAL_GUIDANCE_MANIFEST:-/workspace/datasets/lawqa_jp/external-guidance/manifest.json}
      EXTERNAL_GUIDANCE_CHUNK_CHARS: ${EXTERNAL_GUIDANCE_CHUNK_CHARS:-900}
      AGENT_USE_BM25: ${AGENT_USE_BM25:-true}
      AGENT_USE_VECTOR: ${AGENT_USE_VECTOR:-true}
      AGENT_USE_LLM_PLANNER: ${AGENT_USE_LLM_PLANNER:-true}
      AGENT_MAX_QUERIES: ${AGENT_MAX_QUERIES:-5}
      AGENT_MAX_RETRY_ROUNDS: ${AGENT_MAX_RETRY_ROUNDS:-1}
      AGENT_MAX_TOTAL_TOOL_CALLS: ${AGENT_MAX_TOTAL_TOOL_CALLS:-8}
      AGENT_MAX_GRAPH_HOP: ${AGENT_MAX_GRAPH_HOP:-1}
      AGENT_MAX_GRAPH_PATHS: ${AGENT_MAX_GRAPH_PATHS:-10}
      AGENT_MAX_WALL_TIME_SEC: ${AGENT_MAX_WALL_TIME_SEC:-110}
      AGENT_ANSWER_RESERVE_SEC: ${AGENT_ANSWER_RESERVE_SEC:-60}
      AGENT_ISSUE_COVERAGE_SELECTION: ${AGENT_ISSUE_COVERAGE_SELECTION:-false}
      AGENT_ISSUE_COVERAGE_SHADOW: ${AGENT_ISSUE_COVERAGE_SHADOW:-true}
      AGENT_CANDIDATE_TOP_K: ${AGENT_CANDIDATE_TOP_K:-20}
      AGENT_GUIDANCE_CANDIDATE_TOP_K: ${AGENT_GUIDANCE_CANDIDATE_TOP_K:-10}
      AGENT_RERANK_TOP_K: ${AGENT_RERANK_TOP_K:-16}
      AGENT_RRF_K: ${AGENT_RRF_K:-60}
      AGENT_MAX_LLM_CALLS: ${AGENT_MAX_LLM_CALLS:-3}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-local_http}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://reranker-api:8100}
      RERANK_MODEL: ${RERANK_MODEL:-hotchpotch/japanese-reranker-base-v2}
      RERANK_CANDIDATE_TOP_K: ${RERANK_CANDIDATE_TOP_K:-30}
      RERANK_TIMEOUT_SEC: ${RERANK_TIMEOUT_SEC:-30}
      RERANK_MAX_CHARS: ${RERANK_MAX_CHARS:-3000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_TIMEOUT_SEC: ${EMBEDDING_TIMEOUT_SEC:-120}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_MAX_CHARS: ${EMBEDDING_MAX_CHARS:-1000}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-16384}
      ANTHROPIC_MAX_TOKENS_CEILING: ${ANTHROPIC_MAX_TOKENS_CEILING:-32768}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      OPENAI_MAX_TOKENS_CEILING: ${OPENAI_MAX_TOKENS_CEILING:-16384}
      PLANNER_MODEL: ${PLANNER_MODEL:-}
      PLANNER_MAX_TOKENS: ${PLANNER_MAX_TOKENS:-1024}
      PLANNER_TIMEOUT_SEC: ${PLANNER_TIMEOUT_SEC:-30}
      EVALUATOR_MODEL: ${EVALUATOR_MODEL:-}
      EVALUATOR_MAX_TOKENS: ${EVALUATOR_MAX_TOKENS:-1024}
      EVALUATOR_TIMEOUT_SEC: ${EVALUATOR_TIMEOUT_SEC:-20}
      ANSWER_MODEL: ${ANSWER_MODEL:-}
      REVIEWER_MODEL: ${REVIEWER_MODEL:-}
      REVIEWER_MAX_TOKENS: ${REVIEWER_MAX_TOKENS:-8192}
      JUDGE_MODEL: ${JUDGE_MODEL:-none}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-90}
      LLM_MAX_CONTEXT_CHARS: ${LLM_MAX_CONTEXT_CHARS:-12000}
      LLM_FINALIZATION_MATERIAL_MAX_ITEMS: ${LLM_FINALIZATION_MATERIAL_MAX_ITEMS:-24}
      # LLM主導の法令調査。activeは旧planner/layered選抜を通らない単独回答経路。
      AGENT_LLM_DIRECTED_RETRIEVAL: ${AGENT_LLM_DIRECTED_RETRIEVAL:-false}
      AGENT_LLM_DIRECTED_RETRIEVAL_SHADOW: ${AGENT_LLM_DIRECTED_RETRIEVAL_SHADOW:-false}
      LLM_RESEARCH_MODEL: ${LLM_RESEARCH_MODEL:-}
      LLM_RESEARCH_STAGE_MODEL: ${LLM_RESEARCH_STAGE_MODEL:-}
      LLM_RESEARCH_INTEGRATION_MODEL: ${LLM_RESEARCH_INTEGRATION_MODEL:-}
      RELATION_CLASSIFIER_PROVIDER: ${RELATION_CLASSIFIER_PROVIDER:-ollama}
      RELATION_CLASSIFIER_MODEL: ${RELATION_CLASSIFIER_MODEL:-}
      RELATION_CLASSIFIER_REVIEWER_MODEL: ${RELATION_CLASSIFIER_REVIEWER_MODEL:-}
      RELATION_CLASSIFIER_CONTEXT_TOKENS: ${RELATION_CLASSIFIER_CONTEXT_TOKENS:-131072}
      RELATION_CLASSIFIER_BATCH_SIZE: ${RELATION_CLASSIFIER_BATCH_SIZE:-1}
      RELATION_CLASSIFIER_BATCH_CHARS: ${RELATION_CLASSIFIER_BATCH_CHARS:-30000}
      RELATION_CLASSIFIER_MAX_TOKENS: ${RELATION_CLASSIFIER_MAX_TOKENS:-4096}
      RELATION_CLASSIFIER_TIMEOUT_SEC: ${RELATION_CLASSIFIER_TIMEOUT_SEC:-120}
      LLM_RESEARCH_MAX_TOKENS: ${LLM_RESEARCH_MAX_TOKENS:-4096}
      LLM_RESEARCH_STAGE_EFFORT: ${LLM_RESEARCH_STAGE_EFFORT:-low}
      LLM_RESEARCH_INTEGRATION_MAX_TOKENS: ${LLM_RESEARCH_INTEGRATION_MAX_TOKENS:-8192}
      LLM_RESEARCH_INTEGRATION_EFFORT: ${LLM_RESEARCH_INTEGRATION_EFFORT:-low}
      LLM_RESEARCH_TIMEOUT_SEC: ${LLM_RESEARCH_TIMEOUT_SEC:-90}
      LLM_RESEARCH_MAX_TURNS: ${LLM_RESEARCH_MAX_TURNS:-3}
      LLM_RESEARCH_MAX_ACTIONS_PER_TURN: ${LLM_RESEARCH_MAX_ACTIONS_PER_TURN:-4}
      LLM_RESEARCH_MAX_TOOL_CALLS: ${LLM_RESEARCH_MAX_TOOL_CALLS:-18}
      LLM_RESEARCH_SEARCH_TOP_K: ${LLM_RESEARCH_SEARCH_TOP_K:-8}
      LLM_RESEARCH_DOCUMENT_SEARCH_TOP_K: ${LLM_RESEARCH_DOCUMENT_SEARCH_TOP_K:-30}
      LLM_RESEARCH_MAX_CHUNKS_PER_ARTICLE: ${LLM_RESEARCH_MAX_CHUNKS_PER_ARTICLE:-100}
      LLM_RESEARCH_ACTIVE_BUDGET_SEC: ${LLM_RESEARCH_ACTIVE_BUDGET_SEC:-360}
      LLM_RESEARCH_SHADOW_BUDGET_SEC: ${LLM_RESEARCH_SHADOW_BUDGET_SEC:-180}
      LLM_RESEARCH_MAX_EVIDENCE_ITEMS: ${LLM_RESEARCH_MAX_EVIDENCE_ITEMS:-60}
      LLM_RESEARCH_MAX_SELECTED_EVIDENCE: ${LLM_RESEARCH_MAX_SELECTED_EVIDENCE:-16}
      LLM_RESEARCH_EVIDENCE_CHARS: ${LLM_RESEARCH_EVIDENCE_CHARS:-30000}
      # 新しい汎用Agent Framework。Reviewerは明示的に有効化しない限りOFF。
      AGENT_FRAMEWORK_ACTIVE: ${AGENT_FRAMEWORK_ACTIVE:-false}
      AGENT_FRAMEWORK_REVIEWER_ENABLED: ${AGENT_FRAMEWORK_REVIEWER_ENABLED:-false}
      AGENT_FRAMEWORK_DIAGNOSTICS_MODE: ${AGENT_FRAMEWORK_DIAGNOSTICS_MODE:-off}
      AGENT_FRAMEWORK_POST_RUN_AUDIT: ${AGENT_FRAMEWORK_POST_RUN_AUDIT:-off}
      AGENT_FRAMEWORK_POST_RUN_AUDIT_MAX_TOKENS: ${AGENT_FRAMEWORK_POST_RUN_AUDIT_MAX_TOKENS:-2048}
      AGENT_FRAMEWORK_RESEARCH_MODEL: ${AGENT_FRAMEWORK_RESEARCH_MODEL:-}
      AGENT_FRAMEWORK_INTEGRATION_MODEL: ${AGENT_FRAMEWORK_INTEGRATION_MODEL:-}
      AGENT_FRAMEWORK_FINALIZE_MODEL: ${AGENT_FRAMEWORK_FINALIZE_MODEL:-}
      AGENT_FRAMEWORK_REVIEWER_MODEL: ${AGENT_FRAMEWORK_REVIEWER_MODEL:-}
      AGENT_FRAMEWORK_RESEARCH_MAX_TOKENS: ${AGENT_FRAMEWORK_RESEARCH_MAX_TOKENS:-8192}
      AGENT_FRAMEWORK_INTEGRATION_MAX_TOKENS: ${AGENT_FRAMEWORK_INTEGRATION_MAX_TOKENS:-}
      AGENT_FRAMEWORK_FINALIZE_MAX_TOKENS: ${AGENT_FRAMEWORK_FINALIZE_MAX_TOKENS:-8192}
      AGENT_FRAMEWORK_REVIEWER_MAX_TOKENS: ${AGENT_FRAMEWORK_REVIEWER_MAX_TOKENS:-8192}
      AGENT_FRAMEWORK_MODEL_TIMEOUT_SEC: ${AGENT_FRAMEWORK_MODEL_TIMEOUT_SEC:-180}
      AGENT_FRAMEWORK_MAX_RESEARCH_CYCLES: ${AGENT_FRAMEWORK_MAX_RESEARCH_CYCLES:-4}
      AGENT_FRAMEWORK_MAX_TOOL_REQUESTS_PER_STEP: ${AGENT_FRAMEWORK_MAX_TOOL_REQUESTS_PER_STEP:-5}
      AGENT_FRAMEWORK_MAX_FETCHED_RESOURCES_PER_CYCLE: ${AGENT_FRAMEWORK_MAX_FETCHED_RESOURCES_PER_CYCLE:-5}
      AGENT_FRAMEWORK_MAX_SELECTED_FRONTIER_PER_STEP: ${AGENT_FRAMEWORK_MAX_SELECTED_FRONTIER_PER_STEP:-3}
      AGENT_FRAMEWORK_MAX_GRAPH_CANDIDATES_PER_REVIEW_BATCH: ${AGENT_FRAMEWORK_MAX_GRAPH_CANDIDATES_PER_REVIEW_BATCH:-10}
      AGENT_FRAMEWORK_MAX_PARALLEL_TOOLS: ${AGENT_FRAMEWORK_MAX_PARALLEL_TOOLS:-4}
      AGENT_FRAMEWORK_MAX_RETAINED_EVIDENCE: ${AGENT_FRAMEWORK_MAX_RETAINED_EVIDENCE:-12}
      AGENT_FRAMEWORK_MAX_MATERIAL_EVIDENCE_CHARS: ${AGENT_FRAMEWORK_MAX_MATERIAL_EVIDENCE_CHARS:-50000}
      AGENT_FRAMEWORK_MAX_SOLVER_INPUT_CHARS: ${AGENT_FRAMEWORK_MAX_SOLVER_INPUT_CHARS:-240000}
      AGENT_FRAMEWORK_CYCLE_CLOSE_RESERVE_SEC: ${AGENT_FRAMEWORK_CYCLE_CLOSE_RESERVE_SEC:-15}
      AGENT_FRAMEWORK_MIN_NEXT_CYCLE_BUDGET_SEC: ${AGENT_FRAMEWORK_MIN_NEXT_CYCLE_BUDGET_SEC:-25}
      AGENT_FRAMEWORK_FINALIZATION_RESERVE_SEC: ${AGENT_FRAMEWORK_FINALIZATION_RESERVE_SEC:-90}
      AGENT_FRAMEWORK_MAX_WALL_TIME_SEC: ${AGENT_FRAMEWORK_MAX_WALL_TIME_SEC:-420}
      AGENT_FRAMEWORK_REVIEWER_MAX_REVISIONS: ${AGENT_FRAMEWORK_REVIEWER_MAX_REVISIONS:-1}
      # 法令レイヤー別探索 vNext (docs/layered_legal_evidence_retrieval_plan.md)
      AGENT_TIME_PROFILE_NAME: ${AGENT_TIME_PROFILE_NAME:-}
      AGENT_LAYERED_LEGAL_RETRIEVAL: ${AGENT_LAYERED_LEGAL_RETRIEVAL:-false}
      AGENT_LAYERED_LEGAL_RETRIEVAL_SHADOW: ${AGENT_LAYERED_LEGAL_RETRIEVAL_SHADOW:-false}
      LAYERED_MAX_PRIMARY_ISSUES: ${LAYERED_MAX_PRIMARY_ISSUES:-8}
      LAYERED_ACTIVE_ISSUE_BATCH_SIZE: ${LAYERED_ACTIVE_ISSUE_BATCH_SIZE:-4}
      LAYERED_MAX_REQUIREMENTS_TOTAL: ${LAYERED_MAX_REQUIREMENTS_TOTAL:-24}
      LAYERED_MAX_LEGAL_HOPS: ${LAYERED_MAX_LEGAL_HOPS:-3}
      LAYERED_MAX_EXPANSION_ROUNDS: ${LAYERED_MAX_EXPANSION_ROUNDS:-3}
      LAYERED_MAX_ARTICLES_PER_REQUIREMENT: ${LAYERED_MAX_ARTICLES_PER_REQUIREMENT:-8}
      LAYERED_MAX_ACCEPTED_ARTICLES_PER_REQUIREMENT: ${LAYERED_MAX_ACCEPTED_ARTICLES_PER_REQUIREMENT:-2}
      LAYERED_MAX_CHILD_RELATIONS_PER_ARTICLE: ${LAYERED_MAX_CHILD_RELATIONS_PER_ARTICLE:-6}
      LAYERED_MAX_ARTICLE_CANDIDATES_TOTAL: ${LAYERED_MAX_ARTICLE_CANDIDATES_TOTAL:-64}
      LAYERED_MAX_RERANK_PAIRS_PER_CALL: ${LAYERED_MAX_RERANK_PAIRS_PER_CALL:-16}
      LAYERED_MAX_RERANK_PAIRS_TOTAL: ${LAYERED_MAX_RERANK_PAIRS_TOTAL:-64}
      LAYERED_MAX_RERANK_CALLS_PER_ROUND: ${LAYERED_MAX_RERANK_CALLS_PER_ROUND:-2}
      LAYERED_MAX_RERANK_CALLS_TOTAL: ${LAYERED_MAX_RERANK_CALLS_TOTAL:-8}
      LAYERED_MAX_SEARCH_BATCH_CALLS_PER_ROUND: ${LAYERED_MAX_SEARCH_BATCH_CALLS_PER_ROUND:-2}
      LAYERED_MAX_SEARCH_BATCH_CALLS_TOTAL: ${LAYERED_MAX_SEARCH_BATCH_CALLS_TOTAL:-8}
      LAYERED_MAX_GRAPH_BATCH_CALLS_PER_ROUND: ${LAYERED_MAX_GRAPH_BATCH_CALLS_PER_ROUND:-2}
      LAYERED_MAX_GRAPH_BATCH_CALLS_TOTAL: ${LAYERED_MAX_GRAPH_BATCH_CALLS_TOTAL:-8}
      LAYERED_MAX_EMBEDDING_BATCH_CALLS_PER_ROUND: ${LAYERED_MAX_EMBEDDING_BATCH_CALLS_PER_ROUND:-1}
      LAYERED_MAX_EMBEDDING_BATCH_CALLS_TOTAL: ${LAYERED_MAX_EMBEDDING_BATCH_CALLS_TOTAL:-4}
      LAYERED_MAX_CHUNKS_PER_ARTICLE: ${LAYERED_MAX_CHUNKS_PER_ARTICLE:-3}
      LAYERED_FINAL_CONTEXT_CHUNKS: ${LAYERED_FINAL_CONTEXT_CHUNKS:-16}
      LAYERED_MAX_AUXILIARY_CONTEXT_CHUNKS: ${LAYERED_MAX_AUXILIARY_CONTEXT_CHUNKS:-2}
      LAYERED_MAX_GUIDANCE_PER_ISSUE: ${LAYERED_MAX_GUIDANCE_PER_ISSUE:-5}
      LAYERED_MAX_GUIDE_DERIVED_ARTICLES: ${LAYERED_MAX_GUIDE_DERIVED_ARTICLES:-6}
      LAYERED_MAX_REPLAN_CALLS: ${LAYERED_MAX_REPLAN_CALLS:-1}
      LAYERED_SHADOW_PHASE_BUDGET_SEC: ${LAYERED_SHADOW_PHASE_BUDGET_SEC:-20}
      LAYERED_SHADOW_REMAINING_FRACTION: ${LAYERED_SHADOW_REMAINING_FRACTION:-0.5}
    ports:
      - "8000:8000"
    depends_on:
      opensearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      reranker-api:
        condition: service_healthy
    volumes:
      - ./docs/samples:/workspace/samples:ro
      - ./datasets:/workspace/datasets:ro
      - ./eval-results:/workspace/eval-results

  agent-ui:
    build: ./agent-ui
    environment:
      AGENT_API_URL: http://agent-api:8000
    ports:
      - "8501:8501"
    depends_on:
      - agent-api

  eval-runner:
    build: ./eval-runner
    environment:
      AGENT_API_URL: http://agent-api:8000
      SAMPLES_DIR: /workspace/samples
      EVAL_RESULTS_DIR: /workspace/eval-results
      LAWQA_EVAL_PATH: ${LAWQA_EVAL_PATH:-}
      LAWQA_EVAL_URL: ${LAWQA_EVAL_URL:-}
      EVAL_LIMIT: ${EVAL_LIMIT:-0}
      EVAL_OFFSET: ${EVAL_OFFSET:-0}
      EVAL_PATTERN: ${EVAL_PATTERN:-pattern_2_rule_based_agentic_rag}
      EVAL_SKIP_SEED: ${EVAL_SKIP_SEED:-false}
      REQUEST_TIMEOUT_SEC: ${REQUEST_TIMEOUT_SEC:-150}
      REQUEST_TIMEOUT_SAFETY_MARGIN_SEC: ${REQUEST_TIMEOUT_SAFETY_MARGIN_SEC:-10}
    depends_on:
      - agent-api
    volumes:
      - ./docs/samples:/workspace/samples:ro
      - ./datasets:/workspace/datasets:ro
      - ./eval-results:/workspace/eval-results
    profiles:
      - eval

  # ガイドラインPDFのdocling前処理ワーカー。トリガーは手動のみ:
  #   docker compose --profile preprocess run --rm preprocess-worker python -m app.cli --sync-local
  # AWS移行時は同じhandler.handle_s3_eventをS3 Event Notification→Lambda/ECSから呼ぶ。
  preprocess-worker:
    build: ./preprocess-worker
    environment:
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      PREPROCESS_BUCKET: knowledge-root
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./datasets:/workspace/datasets:ro
    profiles:
      - preprocess

volumes:
  minio_data:
  opensearch_data:
  neo4j_data:
  neo4j_logs:
  reranker_models:
